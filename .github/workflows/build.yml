name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all loaders and versions
        run: |
          chmod +x gradlew
          ./gradlew buildAndCollect :26.2-fabric:plannerTest :26.3-fabric:plannerTest --stacktrace

      - name: Game tests (Fabric 26.2, headless server)
        run: ./gradlew :26.2-fabric:runGametest --stacktrace

      - name: Game tests (Fabric, headless server)
        run: ./gradlew :26.3-fabric:runGametest --stacktrace

      - name: Game tests (NeoForge, headless server)
        run: ./gradlew :26.3-neoforge:runGameTestServer --stacktrace

      - name: Game tests (NeoForge 26.2, headless server)
        run: ./gradlew :26.2-neoforge:runGameTestServer --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-report-26.2-neoforge
          path: versions/26.2-neoforge/build/gametest/report.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-report-26.2
          path: versions/26.2-fabric/build/gametest/report.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-report
          path: versions/26.3-fabric/build/gametest/report.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: tsautocraft-jars
          path: build/libs/*/*.jar
          if-no-files-found: error
