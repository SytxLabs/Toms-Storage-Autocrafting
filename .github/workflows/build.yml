name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same build and tests before it publishes
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build all loaders and versions
        run: |
          chmod +x gradlew
          ./gradlew buildAndCollect --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: tsautocraft-jars
          path: build/libs/*/*.jar
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      # every node reports, even when another one fails
      fail-fast: false
      matrix:
        include:
          - node: 26.2-fabric
            tasks: :26.2-fabric:plannerTest :26.2-fabric:runGametest
          - node: 26.3-fabric
            tasks: :26.3-fabric:plannerTest :26.3-fabric:runGametest
          - node: 26.2-neoforge
            tasks: :26.2-neoforge:runGameTestServer
          - node: 26.3-neoforge
            tasks: :26.3-neoforge:runGameTestServer
    name: test (${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Planner and game tests (headless server)
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.tasks }} --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-report-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/gametest/report.xml
          if-no-files-found: ignore
