name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build all loaders and versions
        run: |
          chmod +x gradlew
          ./gradlew buildAndCollect :26.2-fabric:plannerTest :26.3-fabric:plannerTest --stacktrace

      - name: Game tests (Fabric 26.2, headless server)
        run: ./gradlew :26.2-fabric:runGametest --stacktrace

      - name: Game tests (Fabric, headless server)
        run: ./gradlew :26.3-fabric:runGametest --stacktrace

      - name: Game tests (NeoForge, headless server)
        run: ./gradlew :26.3-neoforge:runGameTestServer --stacktrace

      - name: Game tests (NeoForge 26.2, headless server)
        run: ./gradlew :26.2-neoforge:runGameTestServer --stacktrace

      # Reports of all nodes (versions/<node>/build/gametest/report.xml) in one artifact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-reports
          path: versions/*/build/gametest/report.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: tsautocraft-jars
          path: build/libs/*/*.jar
          if-no-files-found: error
