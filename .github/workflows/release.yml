name: Release

# Push a tag like 0.7.0 (or v0.7.0): builds all loaders/versions and attaches the jars (incl. the API jar) to a GitHub
# release. The tag (without a leading v) must match mod.version in stonecutter.properties.toml.
on:
  push:
    tags: [ 'v*', '[0-9]*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build all loaders and versions
        run: |
          chmod +x gradlew
          ./gradlew buildAndCollect :26.2-fabric:plannerTest :26.3-fabric:plannerTest :26.3-neoforge:runGameTestServer --stacktrace

      - name: Game tests (Fabric 26.2, headless server)
        run: ./gradlew :26.2-fabric:runGametest --stacktrace

      - name: Game tests (Fabric 26.3, headless server)
        run: ./gradlew :26.3-fabric:runGametest --stacktrace

      - name: Game tests (NeoForge 26.2, headless server)
        run: ./gradlew :26.2-neoforge:runGameTestServer --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-reports
          path: versions/*/build/gametest/report.xml
          if-no-files-found: ignore

      - name: Check tag against mod version
        run: |
          VERSION=$(grep -E '^mod.version' stonecutter.properties.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod.version $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Re-runs (or a re-pushed tag) update the existing release instead of failing
      - name: Create or update release with the jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^# $VERSION\$/{f=1;next} /^# /{f=0} f" CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/libs/$VERSION/*.jar --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$VERSION" --notes "${NOTES:-Release $VERSION}"
          else
            gh release create "$GITHUB_REF_NAME" build/libs/$VERSION/*.jar --title "$VERSION" --notes "${NOTES:-Release $VERSION}"
          fi
