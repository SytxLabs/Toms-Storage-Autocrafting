name: Release

# Push a tag like 0.7.0 (or v0.7.0): runs the Build workflow (all loaders/versions, tests in parallel) and attaches its
# jars (incl. the API jar) to a GitHub release. The tag (without a leading v) must match mod.version in
# stonecutter.properties.toml.
on:
  push:
    tags: [ 'v*', '[0-9]*' ]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against mod version
        id: version
        run: |
          VERSION=$(grep -E '^mod.version' stonecutter.properties.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod.version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: [ check, build ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tsautocraft-jars
          path: build/libs

      # Re-runs (or a re-pushed tag) update the existing release instead of failing
      - name: Create or update release with the jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^# $VERSION\$/{f=1;next} /^# /{f=0} f" CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/libs/$VERSION/*.jar --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$VERSION" --notes "${NOTES:-Release $VERSION}"
          else
            gh release create "$GITHUB_REF_NAME" build/libs/$VERSION/*.jar --title "$VERSION" --notes "${NOTES:-Release $VERSION}"
          fi
